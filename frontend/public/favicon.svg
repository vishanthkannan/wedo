<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;display=swap');
    .neon-text {
      font-family: 'Comfortaa', sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.5px;
    }
  </style>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" text-anchor="middle" dominant-baseline="middle">
    <!-- Outer blue glow -->
    <text x="64" y="64" class="neon-text" stroke="#0072ff" stroke-width="7" opacity="0.7" filter="url(#glow)">WEDO</text>
    <!-- Cyan outline -->
    <text x="64" y="64" class="neon-text" stroke="#00c6ff" stroke-width="3.5" filter="url(#glow)">WEDO</text>
    <!-- White core -->
    <text x="64" y="64" class="neon-text" stroke="#ffffff" stroke-width="1">WEDO</text>
  </g>
</svg>
